[package]
name = "longcar-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "longcar"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
gio = { version = "0.22", features = ["v2_80"] }
glib = "0.22"
gst = { package = "gstreamer", version = "0.25", features = ["v1_22"] }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
longcar-core = { path = "../longcar-core" }
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true

[build-dependencies]
glib-build-tools = "0.22"

[lints]
workspace = true
