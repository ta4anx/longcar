<?xml version="1.0" encoding="UTF-8"?>
<!-- Longcar app icon: a monitor with a virtual second display. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <!-- monitor -->
  <rect x="4" y="16" width="86" height="60" rx="9" fill="#3584e4"/>
  <rect x="10" y="22" width="74" height="48" rx="5" fill="#1a5fb4"/>
  <rect x="10" y="22" width="74" height="48" rx="5" fill="url(#screen)" opacity="0.55"/>
  <rect x="14" y="26" width="66" height="40" rx="3" fill="#1c71d8" opacity="0.45"/>

  <!-- stand -->
  <rect x="39" y="76" width="16" height="10" rx="2" fill="#3584e4"/>
  <rect x="26" y="86" width="42" height="7" rx="3.5" fill="#3584e4"/>

  <!-- virtual second display -->
  <rect x="82" y="30" width="42" height="66" rx="7" fill="#99c1f1"/>
  <rect x="87" y="36" width="32" height="48" rx="4" fill="#3584e4"/>
  <rect x="90" y="39" width="26" height="42" rx="2" fill="#1c71d8" opacity="0.6"/>
  <circle cx="103" cy="90" r="2.6" fill="#1a5fb4"/>
</svg>
