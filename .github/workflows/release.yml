name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-pipewire gstreamer1.0-gtk4 \
            gnome-shell desktop-file-utils libxml2-utils appstream \
            zip unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --workspace

      - name: Build artifacts
        run: |
          ./scripts/build-extension.sh
          ./scripts/build-deb.sh
          sha256sum build/longcar_0.1.0_amd64.deb \
            build/longcar@ta4anx.github.io.shell-extension.zip > build/SHA256SUMS
          cat build/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/longcar_0.1.0_amd64.deb \
            build/longcar@ta4anx.github.io.shell-extension.zip \
            build/SHA256SUMS \
            --title "Longcar $GITHUB_REF_NAME" \
            --generate-notes
